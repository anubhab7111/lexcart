# One-command evaluation environment:
#   docker compose up --build
# UI + API at http://localhost:8000 (docs at /docs), mock Razorpay gateway.
# Then, to run the automated evaluation harness:
#   docker compose exec server python /app/demo/evaluate.py
# or the autonomous AI buyer:
#   docker compose exec server python /app/demo/ai_buyer.py --need "property dispute" --budget 4000

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lawweb
      POSTGRES_PASSWORD: lawweb
      POSTGRES_DB: lexcart
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lawweb -d lexcart"]
      interval: 2s
      timeout: 2s
      retries: 30

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      LEXCART_LITE: "1"
      DATABASE_URL: postgresql://lawweb:lawweb@db:5432/lexcart
      # Demo secret for the evaluation sandbox only — never reuse for a real deployment.
      JWT_SECRET: lexcart-eval-sandbox-jwt-secret-0123456789abcdef
      # Leave the Razorpay keys unset to run the mock gateway; set rzp_test_*
      # values here to exercise real Razorpay test mode instead.
      # RAZORPAY_KEY_ID:
      # RAZORPAY_KEY_SECRET:
    ports:
      - "8000:8000"
